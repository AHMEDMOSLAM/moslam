/* إعادة تعيين الإعدادات الافتراضية */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: Arial, sans-serif;
    direction: rtl;
    background-color: #f4f4f4;
  }
  
  /* شريط التنقل */
  header {
    background-color: #4CAF50;
    color: white;
    padding: 20px;
    text-align: center;
  }
  
  header .logo h1 {
    margin: 0;
  }
  
  /* قسم تسجيل الدخول */
  .login-section {
    text-align: center;
    margin-top: 50px;
  }
  
  .login-form {
    background-color: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    width: 300px;
    margin: 0 auto;
  }
  
  .login-form label {
    display: block;
    margin-bottom: 8px;
    font-size: 16px;
  }
  
  .login-form input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  
  .login-form button {
    width: 100%;
    padding: 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
  }
  
  .login-form button:hover {
    background-color: #45a049;
  }
  
  /* قسم الدورات التدريبية */
  .courses-section {
    text-align: center;
    margin-top: 30px;
  }
  
  .courses {
    display: flex;
    justify-content: space-around;
    margin-bottom: 50px;
    flex-wrap: wrap;
  }
  
  .course {
    background-color: white;
    border-radius: 8px;
    padding: 20px;
    width: 250px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin: 10px;
    text-align: center;
  }
  
  .course h3 {
    font-size: 20px;
    color: #333;
    margin-bottom: 10px;
  }
  
  /* إضافة نمط للصورة داخل كل دورة */
  .course-img {
    width: 100%;
    height: auto;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  
  .course p {
    font-size: 16px;
    color: #666;
    margin-bottom: 15px;
  }
  
  .course button {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
  }
  
  .course button:hover {
    background-color: #45a049;
  }
  
  .video-link {
    display: block;
    margin-top: 15px;
    text-align: center;
    font-size: 16px;
    color: #4CAF50;
    text-decoration: none;
  }
  
  .video-link:hover {
    text-decoration: underline;
  }
  
  /* تفاصيل الدورة */
  .course-details {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    width: 300px;
    margin: 20px auto;
    text-align: center;
    display: none;
  }
  
  .course-details h3 {
    margin-bottom: 20px;
  }
  
  .course-details p {
    margin-bottom: 10px;
    font-size: 16px;
    color: #555;
  }
  
  .course-details button {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
  }
  
  .course-details button:hover {
    background-color: #45a049;
  }
  
  /* نموذج بيانات الدفع */
  .payment-form {
    display: none;
    background-color: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    width: 300px;
    margin: 20px auto;
    text-align: center;
  }
  
  .payment-form input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  
  .payment-form button {
    width: 100%;
    padding: 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
  }
  
  .payment-form button:hover {
    background-color: #45a049;
  }
  
  /* رسالة تأكيد التسجيل */
  .success-message {
    display: none;
    background-color: #d4edda;
    color: #155724;
    padding: 20px;
    border-radius: 8px;
    width: 80%;
    margin: 20px auto;
    text-align: center;
  }
  
  /* التذييل */
  footer {
    background-color: #333;
    color: white;
    padding: 20px;
    text-align: center;
  }
  
  footer p {
    margin: 0;
  }
  